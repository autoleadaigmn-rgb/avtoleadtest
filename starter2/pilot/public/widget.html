<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service request assistant</title><link rel="stylesheet" href="/pilot.css"><body><main><header><p class="eyebrow">Rule-based service assistant</p><h1 id="shop-name">Loading…</h1><p id="greeting"></p><p class="notice">A request is not a confirmed appointment. The shop will contact you.</p></header><section><h2>How can we help?</h2><div class="actions"><button type="button" class="secondary" data-answer="services">Services</button><button type="button" class="secondary" data-answer="hours">Hours</button><button type="button" class="secondary" data-answer="next">What happens next?</button></div><p id="answer" role="status">Choose a topic or complete the request below. Responses use the shop's configured information, not generative AI.</p><form id="request-form"><label>Your name<input name="name" maxlength="100" required autocomplete="name"></label><label>Email<input name="email" type="email" maxlength="254" autocomplete="email"></label><label>Phone<input name="phone" type="tel" maxlength="30" autocomplete="tel"></label><p class="hint">Enter at least one contact method.</p><label>Vehicle<input name="vehicle" maxlength="120" required placeholder="Year, make and model"></label><label>What is happening?<textarea name="issue" maxlength="2000" minlength="10" required rows="3"></textarea></label><label>Preferred date<input name="date" type="date" required></label><label>Preferred time, if known<input name="time" type="time"></label><input name="website" tabindex="-1" autocomplete="off" class="honeypot" aria-hidden="true"><div id="challenge"></div><label class="check"><input name="consent" type="checkbox" required> <span id="privacy-summary">Your details will be stored and sent to the shop only with your consent.</span> <a id="privacy" target="_blank" rel="noopener">Privacy notice</a></label><button id="submit" type="submit" disabled>Send service request</button><button id="new" type="button" hidden>Start another request</button><p id="status" role="status"></p></form></section><button id="close" type="button" class="secondary">Close</button></main><script type="module" src="/widget.js"></script></body></html>
